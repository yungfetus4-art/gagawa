name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      # Installs Gradle itself, so the project doesn't need the wrapper files.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build the mod jar
        run: gradle build

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: greenlantern-jar
          path: build/libs/*.jar
